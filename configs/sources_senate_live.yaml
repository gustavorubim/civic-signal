extends: sources_senate.yaml
sources:
  # Exclude synthetic 2026 panel polls on the live path; keep historical panel cycles
  # for calibration while 2026 polling comes from VoteHub.
  - id: senate_state_panel_polls
    table: polls
    type: fixture
    path: fixtures/senate_state_panel.csv
    parser_version: senate-state-panel-polls-v1
    license: Synthetic Senate state panel; see scripts/generate_senate_panel.py.
    url: file://fixtures/senate_state_panel.csv
    parser_args:
      cycles: [2014, 2016, 2018, 2020, 2022, 2024]
      as_of_offsets_days: [90, 60, 31, 30, 7, 1]
      sample_size: 850
  # Live 2026 Senate polling via VoteHub (CC BY 4.0). FiveThirtyEight Datasette has
  # zero cycle=2026 rows; VoteHub is the production live poll feed.
  - id: votehub_senate_polls_2026
    table: polls
    type: http_json
    path: votehub_senate_polls_2026.json
    parser_version: votehub-race-polls-v2
    license: VoteHub Polling API data under CC BY 4.0; attribute VoteHub (https://votehub.com/polls/api/).
    auth_mode: public
    url: https://api.votehub.com/polls?poll_type=us-senator
    parser_args:
      cycle: 2026
      office: senate
      poll_type: us-senator
      parties: [DEM, REP]
      party_map_path: fixtures/candidates_2026_parties.csv
      require_nominees: true
      dedupe_versions: true
      # Nebraska: no Democratic nominee; independent Dan Osborn is the anti-REP option.
      race_parties:
        US-SEN-NE-2026: [IND, REP]
  - id: wikipedia_senate_2026_race_presence
    table: public_signals
    type: http_text
    path: wikipedia_2026_senate.wikitext
    parser_version: wikipedia-race-presence-signals-v1
    license: Wikipedia article text under CC BY-SA/GFDL; used only as opt-in race-presence metadata.
    auth_mode: public
    url: https://en.wikipedia.org/wiki/2026_United_States_Senate_elections?action=raw
    parser_args:
      cycle: 2026
      observed_at: "2026-07-08T00:00:00Z"
      races:
        - race_id: US-SEN-GA-2026
          office_type: senate
          patterns:
            - "2026 United States Senate election in Georgia"
            - "^==\\s*Georgia\\s*=="
