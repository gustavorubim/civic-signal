extends: sources_house.yaml
sources:
  # Exclude synthetic 2026 panel polls on the live path; keep historical panel cycles
  # for calibration while 2026 polling comes from VoteHub.
  - id: house_district_panel_polls
    table: polls
    type: fixture
    path: fixtures/house_district_panel.csv
    parser_version: house-district-panel-polls-v1
    license: Synthetic House district panel; see scripts/generate_house_panel.py.
    url: file://fixtures/house_district_panel.csv
    parser_args:
      cycles: [2014, 2016, 2018, 2020, 2022, 2024]
      as_of_offsets_days: [90, 60, 31, 30, 7, 1]
      sample_size: 600
  # Live 2026 House polling via VoteHub (CC BY 4.0). house_race_id_format is hyphenated
  # to match the panel's US-HOUSE-{ST}-{NN}-2026 race ids.
  - id: votehub_house_polls_2026
    table: polls
    type: http_json
    path: votehub_house_polls_2026.json
    parser_version: votehub-race-polls-v2
    license: VoteHub Polling API data under CC BY 4.0; attribute VoteHub (https://votehub.com/polls/api/).
    auth_mode: public
    url: https://api.votehub.com/polls?poll_type=us-representative
    parser_args:
      cycle: 2026
      office: house
      poll_type: us-representative
      parties: [DEM, REP]
      house_race_id_format: hyphenated
      party_map_path: fixtures/candidates_2026_parties.csv
      require_nominees: true
      dedupe_versions: true
      # Same-party top-two generals (Wikipedia 2026 House table, 2026-10-19): CA-40 is
      # R v R; the rest are D v D. Their seats are decided by party; polls are skipped.
      same_party_races:
        - US-HOUSE-CA-40-2026
        - US-HOUSE-CA-04-2026
        - US-HOUSE-CA-07-2026
        - US-HOUSE-CA-11-2026
        - US-HOUSE-CA-12-2026
        - US-HOUSE-CA-14-2026
        - US-HOUSE-CA-29-2026
        - US-HOUSE-CA-34-2026
        - US-HOUSE-CA-37-2026
      # Incumbent Kevin Kiley is listed as an independent (Wikipedia 2026 House table).
      race_parties:
        US-HOUSE-CA-06-2026: [DEM, IND]
  - id: wikipedia_house_2026_race_presence
    table: public_signals
    type: http_text
    path: wikipedia_2026_house.wikitext
    parser_version: wikipedia-race-presence-signals-v1
    license: Wikipedia article text under CC BY-SA/GFDL; used only as opt-in race-presence metadata.
    auth_mode: public
    url: https://en.wikipedia.org/wiki/2026_United_States_House_of_Representatives_elections?action=raw
    parser_args:
      cycle: 2026
      observed_at: "2026-07-08T00:00:00Z"
      races:
        - race_id: US-HOUSE-CA-45-2026
          office_type: house
          patterns:
            - "\\{\\{ushr\\|CA\\|45\\|X\\}\\}"
            - "2024 California's 45th congressional district election"
